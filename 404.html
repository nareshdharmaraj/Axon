<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXON // SECTOR_LOST</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-glitch {
            font-size: 15rem;
            font-weight: 800;
            font-family: 'Syne';
            position: relative;
            color: var(--v-white);
            mix-blend-mode: exclusion;
        }

        .error-glitch::before,
        .error-glitch::after {
            content: "404";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--v-black);
            mix-blend-mode: hard-light;
        }

        .error-glitch::before {
            left: -5px;
            text-shadow: 2px 0 var(--v-accent);
            animation: glitch-1 2s infinite linear alternate-reverse;
        }

        .error-glitch::after {
            left: 5px;
            text-shadow: -2px 0 red;
            animation: glitch-2 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-1 {
            0% {
                clip-path: inset(20% 0 80% 0);
            }

            20% {
                clip-path: inset(60% 0 10% 0);
            }

            40% {
                clip-path: inset(40% 0 50% 0);
            }

            60% {
                clip-path: inset(80% 0 5% 0);
            }

            80% {
                clip-path: inset(10% 0 70% 0);
            }

            100% {
                clip-path: inset(30% 0 20% 0);
            }
        }

        @keyframes glitch-2 {
            0% {
                clip-path: inset(10% 0 60% 0);
            }

            20% {
                clip-path: inset(30% 0 20% 0);
            }

            40% {
                clip-path: inset(70% 0 10% 0);
            }

            60% {
                clip-path: inset(20% 0 50% 0);
            }

            80% {
                clip-path: inset(50% 0 30% 0);
            }

            100% {
                clip-path: inset(0% 0 80% 0);
            }
        }
    </style>
</head>

<body
    style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background: var(--v-black);">
    <div class="v-label" style="margin-bottom: 20px;">SYSTEM_ERROR // COORD_INVALID</div>
    <div class="error-glitch">404</div>
    <p style="margin-top: 40px; color: var(--v-white); opacity: 0.6; text-align: center; max-width: 400px;">The
        requested vector does not exist within the AXON network. Rerouting recommended.</p>
    <a href="index.html" class="v-button" style="margin-top: 40px;"><span>Return to Core</span></a>

    <script src="main.js"></script>
</body>

</html>
